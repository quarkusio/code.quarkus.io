name: Release CI

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  release:
    runs-on: ubuntu-latest
    name: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check for changes
        id: check_changes
        run: |
          LAST_RELEASE_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -z "$LAST_RELEASE_TAG" ]; then
            echo "No previous release tag found. Proceeding with release..."
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "release_version=1" >> $GITHUB_OUTPUT
            exit 0
          fi
          release_version=$(( ${LAST_RELEASE_TAG#v} + 1 ))
          status=$(curl -s -o /dev/null -w "%{http_code}" "https://repo1.maven.org/maven2/io/quarkus/code/code-quarkus/${release_version}/code-quarkus-${release_version}.pom")
          if [ "$status" = "200" ]; then
            echo "Version ${release_version} already published on Maven Central. Skipping..."
            echo "skip=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          CHANGES=$(git log "${LAST_RELEASE_TAG}..HEAD" --oneline -1 -- . ':!.github')
          if [ -z "$CHANGES" ]; then
            echo "No changes since last release ($LAST_RELEASE_TAG). Skipping..."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "Changes detected since $LAST_RELEASE_TAG. Proceeding with release ${release_version}..."
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "release_version=${release_version}" >> $GITHUB_OUTPUT
          fi

      - name: Set up JDK 21
        if: steps.check_changes.outputs.skip == 'false'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: 'maven'
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Ensure browsers are installed
        if: steps.check_changes.outputs.skip == 'false'
        run: mvn exec:java -e -D exec.mainClass=com.microsoft.playwright.CLI -D exec.args="install chromium --with-deps"

      - name: Build and deploy
        if: steps.check_changes.outputs.skip == 'false'
        run: |
          release_version=${{ steps.check_changes.outputs.release_version }}
          echo "Releasing version: $release_version"
          mvn -B versions:set -DnewVersion=${release_version} -DgenerateBackupPoms=false
          mvn -B clean install -Dlib -Dcommunity-app -Dacceptance-test
          mvn -B deploy -Prelease -Dlib -DskipTests
        env:
          MAVEN_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      - name: Run JReleaser
        if: steps.check_changes.outputs.skip == 'false'
        uses: jreleaser/release-action@v2
        env:
          JRELEASER_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JRELEASER_PROJECT_VERSION: ${{ steps.check_changes.outputs.release_version }}
        with:
          setup-java: false

      # Persist logs
      - name: JReleaser release output
        if: steps.check_changes.outputs.skip == 'false'
        uses: actions/upload-artifact@v7
        with:
          name: jreleaser-release
          path: |
            out/jreleaser/trace.log
            out/jreleaser/output.properties
