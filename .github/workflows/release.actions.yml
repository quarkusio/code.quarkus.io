name: Release CI

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  release:
    runs-on: ubuntu-latest
    name: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0
      - name: Check for changes
        id: check_changes
        run: |
          LAST_RELEASE_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -z "$LAST_RELEASE_TAG" ]; then
            echo "No previous release tag found. Proceeding with release..."
            echo "skip=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          CHANGES=$(git log "${LAST_RELEASE_TAG}..HEAD" --oneline -1 --invert-grep --grep='\[maven-release-plugin\]' -- . ':!.github')
          if [ -z "$CHANGES" ]; then
            echo "No changes since last release ($LAST_RELEASE_TAG). Skipping..."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "Changes detected since $LAST_RELEASE_TAG. Proceeding with release..."
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Set up JDK 21
        if: steps.check_changes.outputs.skip == 'false'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: 'maven'
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Configure Git author
        if: steps.check_changes.outputs.skip == 'false'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

      - name: Ensure browsers are installed
        if: steps.check_changes.outputs.skip == 'false'
        run: mvn exec:java -e -D exec.mainClass=com.microsoft.playwright.CLI -D exec.args="install chromium --with-deps"

      - name: Maven release
        if: steps.check_changes.outputs.skip == 'false'
        id: maven_release
        run: |
          current_version=$(mvn -q -Dexec.executable=echo -Dexec.args='${project.version}' --non-recursive exec:exec)
          release_version=${current_version%-SNAPSHOT}
          echo "Next release version is: $release_version"
          next_dev_version="$(( ${release_version} + 1 ))-SNAPSHOT"
          echo "Next development version is: $next_dev_version"
          mvn -B release:prepare -DreleaseVersion=${release_version} -DdevelopmentVersion=${next_dev_version} -Dlib -Prelease -Dcommunity-app -Dacceptance-test
          mvn -B release:perform -Prelease -Dlib
          echo "release_version=$release_version" >> $GITHUB_OUTPUT
          echo "next_dev_version=$next_dev_version" >> $GITHUB_OUTPUT
        env:
          MAVEN_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      - name: Run JReleaser
        if: steps.check_changes.outputs.skip == 'false'
        uses: jreleaser/release-action@v2
        env:
          JRELEASER_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JRELEASER_PROJECT_VERSION: ${{ steps.maven_release.outputs.release_version }}
        with:
          setup-java: false

      # Persist logs
      - name: JReleaser release output
        if: steps.check_changes.outputs.skip == 'false'
        uses: actions/upload-artifact@v7
        with:
          name: jreleaser-release
          path: |
            out/jreleaser/trace.log
            out/jreleaser/output.properties

      - name: Push version bump
        if: steps.check_changes.outputs.skip == 'false'
        run: git push
